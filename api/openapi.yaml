    post:
      operationId: createProjectCredential
      summary: Create a new API credential (secret shown once)
      security:
        - sessionCookie: []
      tags:
        - credentials
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/ProjectIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
