          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

components:
  parameters:
    CSRFTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token required on state-changing cookie-authenticated requests (ADR-005).
      schema:
        type: string
        minLength: 1
    OrgIDPath:
      name: orgId
      in: path
      required: true
      description: Organization UUID.
      schema:
        type: string
        format: uuid
        x-go-type: string
    MemberIDPath:
      name: memberId
      in: path
      required: true
      description: Membership UUID.
      schema:
        type: string
        format: uuid
        x-go-type: string
    InvitationIDPath:
      name: invitationId
      in: path
      required: true
      description: Invitation UUID.
      schema:
        type: string
        format: uuid
        x-go-type: string
    TeamIDPath:
      name: teamId
      in: path
      required: true
      description: Team UUID.
      schema:
        type: string
        format: uuid
        x-go-type: string
    ProjectIDPath:
      name: projectId
      in: path
      required: true
      description: Project UUID.
      schema:
        type: string
        format: uuid
        x-go-type: string
    EnvironmentIDPath:
      name: environmentId
      in: path
      required: true
      description: Environment UUID.
      schema:
        type: string
        format: uuid
        x-go-type: string
    CredentialIDPath:
      name: credentialId
      in: path
      required: true
      description: API credential UUID.
      schema:
        type: string
        format: uuid
        x-go-type: string

  responses:
    BadRequest:
      description: Invalid JSON or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication or recent reauthentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden, CSRF invalid, email not verified (`EMAIL_NOT_VERIFIED`), MFA setup required (`MFA_SETUP_REQUIRED`), or protected resource (`PROTECTED_RESOURCE`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict (e.g. duplicate slug or member)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DefaultError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMIT_EXCEEDED`)
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
        RateLimit-Limit:
          description: Request limit for the active window.
          schema:
            type: integer
            minimum: 1
        RateLimit-Remaining:
          description: Remaining requests in the active window.
          schema:
            type: integer
            minimum: 0
        RateLimit-Reset:
          description: Seconds until the rate limit window resets.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: Service temporarily unavailable due to backpressure, such as Argon2id concurrency saturation (`SERVICE_UNAVAILABLE`)
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vigia_session
      description: HttpOnly session cookie for browser UI authentication.
    ingestKey:
      type: http
      scheme: bearer
      bearerFormat: vg_ing_<prefix>_<secret>
      description: Write-only telemetry ingestion key scoped to a project/environment.
    clientToken:
      type: http
      scheme: bearer
      bearerFormat: vg_cli_<prefix>_<secret>
      description: Read-only client token for querying data and subscribing to SSE streams.

  schemas:
    StatusResponse:
      type: object
      required:
        - service
        - status
        - version
        - commit
      properties:
        service:
          type: string
          example: vigia
        status:
          type: string
          example: ok
        version:
          type: string
          example: dev
        commit:
          type: string
          example: none

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string

    ErrorBody:
      type: object
      required:
        - code
        - message
        - requestId
        - details
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: The requested resource was not found.
        requestId:
          type: string
          example: req_019a2f7d8b4c9e1023456789
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    AcceptedMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: If your request is eligible, check your email for further instructions.

    AuthUser:
      type: object
      required:
        - id
        - email
        - name
        - mfaEnabled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        mfaEnabled:
          type: boolean

    AuthSessionResponse:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        csrfToken:
          type: string
          description: CSRF token to send in the X-CSRF-Token header on subsequent state-changing requests.
        expiresAt:
          type: string
          format: date-time

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256

    PasswordForgotRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          maxLength: 254

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    MFAChallengeResponse:
      type: object
      required:
        - mfaRequired
        - csrfToken
        - expiresAt
      properties:
        mfaRequired:
          type: boolean
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    MFASetupResponse:
      type: object
      required:
        - secret
        - otpauthUri
      properties:
        secret:
          type: string
        otpauthUri:
          type: string

    MFAVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 12
        recoveryCode:
          type: string
          minLength: 16
          maxLength: 32

    MFAVerifyResponse:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        recoveryCodes:
          type: array
          items:
            type: string

    ReauthRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 6
          maxLength: 12

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 3
          maxLength: 63

    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    ConfirmSlugRequest:
      type: object
      additionalProperties: false
      required:
        - confirmSlug
      properties:
        confirmSlug:
          type: string
          minLength: 1
          maxLength: 63

    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required:
        - newOwnerUserId
        - confirmSlug
      properties:
        newOwnerUserId:
          type: string
          format: uuid
          x-go-type: string
        confirmSlug:
          type: string
          minLength: 1
          maxLength: 63

    OrganizationResponse:
      type: object
      required:
        - id
        - name
        - slug
        - status
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        purgeAfter:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    OrganizationSummary:
      type: object
      required:
        - organizationId
        - name
        - slug
        - orgStatus
        - role
        - membershipStatus
      properties:
        organizationId:
          type: string
        name:
          type: string
        slug:
          type: string
        orgStatus:
          type: string
        role:
          type: string
        membershipStatus:
          type: string

    OrganizationSummaryListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationSummary"

    MemberResponse:
      type: object
      required:
        - id
        - organizationId
        - userId
        - email
        - name
        - role
        - status
        - createdAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    MemberListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberResponse"

    UpdateMemberRoleRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum: [admin, member, viewer]

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          maxLength: 254
        role:
          type: string
          enum: [admin, member, viewer]

    InvitationResponse:
      type: object
      required:
        - id
        - organizationId
        - email
        - role
        - invitedBy
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        email:
          type: string
        role:
          type: string
        invitedBy:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InvitationListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvitationResponse"

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256

    AcceptInvitationResponse:
      type: object
      required:
        - organizationId
      properties:
        organizationId:
          type: string

    CreateTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
