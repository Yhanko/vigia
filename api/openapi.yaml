openapi: 3.1.0
info:
  title: Vigia API
  version: 0.1.0
  description: >
    Unified monitoring, real-time alerting, audit, and error tracking platform.
    Contract source of truth for backend (Go) and frontend/SDK (TypeScript).
  license:
    name: Proprietary
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development server

paths:
  /status:
    get:
      operationId: getStatus
      summary: API status and build metadata
      security: []
      tags:
        - system
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: authRegister
      summary: Register a new user account
      description: >
        Creates a user account and triggers email verification. Always returns a
        generic 202 response on valid input to prevent account enumeration (ADR-005).
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration request accepted (generic anti-enumeration response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid JSON or domain validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: authLogin
      summary: Authenticate with email and password
      description: >
        Verifies credentials with Argon2id (after rate limiting), rotates the session,
        and sets the HttpOnly session cookie. Returns a generic 401 on invalid credentials
        to prevent account enumeration (ADR-005).
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session established via HttpOnly Set-Cookie header
          headers:
            Set-Cookie:
              description: HttpOnly session cookie (`vigia_session` in development, `__Host-vigia_session` in staging/production).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "202":
          description: Password verified; MFA verification required to complete login (sets short-lived pending session cookie)
          headers:
            Set-Cookie:
              description: HttpOnly MFA-pending session cookie (10-minute TTL).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAChallengeResponse"
        "400":
          description: Invalid JSON or validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials or MFA required (`INVALID_CREDENTIALS`, `MFA_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the active session and clear the session cookie
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "204":
          description: Session revoked and cookie cleared
          headers:
            Set-Cookie:
              description: Expired session cookie clearing browser storage.
              schema:
                type: string
        "401":
          description: Missing, expired, or revoked session (`UNAUTHENTICATED`, `SESSION_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing or invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate and extend the active sliding session
      description: >
        Extends the sliding 7-day session window (up to the 30-day absolute limit),
        rotates the session token and CSRF token, and updates the HttpOnly cookie.
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "200":
          description: Session refreshed and rotated via Set-Cookie header
          headers:
            Set-Cookie:
              description: Rotated HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Missing, expired, or revoked session (`UNAUTHENTICATED`, `SESSION_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing or invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      summary: Verify a user email address using a single-use token
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid, expired, or already-used verification token (`VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing Origin (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password/forgot:
    post:
      operationId: authPasswordForgot
      summary: Request a password reset email
      description: >
        Always returns a generic 202 response to prevent account enumeration (ADR-005).
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordForgotRequest"
      responses:
        "202":
          description: Password reset request accepted (generic anti-enumeration response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid JSON or email (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing Origin (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password/reset:
    post:
      operationId: authPasswordReset
      summary: Reset password using a single-use reset token and revoke all sessions
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password updated and all active sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid token or password policy failure (`VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing Origin (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/setup:
    post:
      operationId: authMFASetup
      summary: Begin TOTP MFA enrollment (requires recent authentication)
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "200":
          description: TOTP provisioning secret and otpauth URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupResponse"
        "401":
          description: Unauthenticated, expired session, or re-authentication required (`UNAUTHENTICATED`, `SESSION_EXPIRED`, `REAUTH_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/verify:
    post:
      operationId: authMFAVerify
      summary: Verify TOTP or recovery code (completes MFA setup or two-step login)
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA verified and session rotated (includes one-time recoveryCodes on initial activation)
          headers:
            Set-Cookie:
              description: Rotated full HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponse"
        "400":
          description: Validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid MFA code or expired/locked pending session (`INVALID_MFA_CODE`, `SESSION_EXPIRED`, `UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reauth:
    post:
      operationId: authReauth
      summary: Re-authenticate an active session for high-risk operations
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: Re-authenticated and session rotated with fresh last_auth_at
          headers:
            Set-Cookie:
              description: Rotated HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials, invalid MFA code, or expired session (`INVALID_CREDENTIALS`, `INVALID_MFA_CODE`, `SESSION_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    CSRFTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token required on state-changing cookie-authenticated requests (ADR-005).
      schema:
        type: string
        minLength: 1

  responses:
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMIT_EXCEEDED`)
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
        RateLimit-Limit:
          description: Request limit for the active window.
          schema:
            type: integer
            minimum: 1
        RateLimit-Remaining:
          description: Remaining requests in the active window.
          schema:
            type: integer
            minimum: 0
        RateLimit-Reset:
          description: Seconds until the rate limit window resets.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: Service temporarily unavailable due to backpressure, such as Argon2id concurrency saturation (`SERVICE_UNAVAILABLE`)
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vigia_session
      description: HttpOnly session cookie for browser UI authentication.
    ingestKey:
      type: http
      scheme: bearer
      bearerFormat: vg_ing_<prefix>_<secret>
      description: Write-only telemetry ingestion key scoped to a project/environment.
    clientToken:
      type: http
      scheme: bearer
      bearerFormat: vg_cli_<prefix>_<secret>
      description: Read-only client token for querying data and subscribing to SSE streams.

  schemas:
    StatusResponse:
      type: object
      required:
        - service
        - status
        - version
        - commit
      properties:
        service:
          type: string
          example: vigia
        status:
          type: string
          example: ok
        version:
          type: string
          example: dev
        commit:
          type: string
          example: none

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string

    ErrorBody:
      type: object
      required:
        - code
        - message
        - requestId
        - details
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: The requested resource was not found.
        requestId:
          type: string
          example: req_019a2f7d8b4c9e1023456789
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    AcceptedMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: If your request is eligible, check your email for further instructions.

    AuthUser:
      type: object
      required:
        - id
        - email
        - name
        - mfaEnabled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        mfaEnabled:
          type: boolean

    AuthSessionResponse:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        csrfToken:
          type: string
          description: CSRF token to send in the X-CSRF-Token header on subsequent state-changing requests.
        expiresAt:
          type: string
          format: date-time

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256

    PasswordForgotRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          maxLength: 254

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    MFAChallengeResponse:
      type: object
      required:
        - mfaRequired
        - csrfToken
        - expiresAt
      properties:
        mfaRequired:
          type: boolean
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    MFASetupResponse:
      type: object
      required:
        - secret
        - otpauthUri
      properties:
        secret:
          type: string
        otpauthUri:
          type: string

    MFAVerifyRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 12
        recoveryCode:
          type: string
          minLength: 16
          maxLength: 32

    MFAVerifyResponse:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        recoveryCodes:
          type: array
          items:
            type: string

    ReauthRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        code:
          type: string
          minLength: 6
          maxLength: 12
