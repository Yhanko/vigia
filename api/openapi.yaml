openapi: 3.1.0
info:
  title: Vigia API
  version: 0.1.0
  description: >
    Unified monitoring, real-time alerting, audit, and error tracking platform.
    Contract source of truth for backend (Go) and frontend/SDK (TypeScript).
  license:
    name: Proprietary
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development server

paths:
  /status:
    get:
      operationId: getStatus
      summary: API status and build metadata
      security: []
      tags:
        - system
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: authRegister
      summary: Register a new user account
      description: >
        Creates a user account and triggers email verification. Always returns a
        generic 202 response on valid input to prevent account enumeration (ADR-005).
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration request accepted (generic anti-enumeration response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid JSON or domain validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: authLogin
      summary: Authenticate with email and password
      description: >
        Verifies credentials with Argon2id (after rate limiting), rotates the session,
        and sets the HttpOnly session cookie. Returns a generic 401 on invalid credentials
        to prevent account enumeration (ADR-005).
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session established via HttpOnly Set-Cookie header
          headers:
            Set-Cookie:
              description: HttpOnly session cookie (`vigia_session` in development, `__Host-vigia_session` in staging/production).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "202":
          description: Password verified; MFA verification required to complete login (sets short-lived pending session cookie)
          headers:
            Set-Cookie:
              description: HttpOnly MFA-pending session cookie (10-minute TTL).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAChallengeResponse"
        "400":
          description: Invalid JSON or validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials or MFA required (`INVALID_CREDENTIALS`, `MFA_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the active session and clear the session cookie
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "204":
          description: Session revoked and cookie cleared
          headers:
            Set-Cookie:
              description: Expired session cookie clearing browser storage.
              schema:
                type: string
        "401":
          description: Missing, expired, or revoked session (`UNAUTHENTICATED`, `SESSION_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing or invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate and extend the active sliding session
      description: >
        Extends the sliding 7-day session window (up to the 30-day absolute limit),
        rotates the session token and CSRF token, and updates the HttpOnly cookie.
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "200":
          description: Session refreshed and rotated via Set-Cookie header
          headers:
            Set-Cookie:
              description: Rotated HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Missing, expired, or revoked session (`UNAUTHENTICATED`, `SESSION_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing or invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      summary: Verify a user email address using a single-use token
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid, expired, or already-used verification token (`VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing Origin (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password/forgot:
    post:
      operationId: authPasswordForgot
      summary: Request a password reset email
      description: >
        Always returns a generic 202 response to prevent account enumeration (ADR-005).
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordForgotRequest"
      responses:
        "202":
          description: Password reset request accepted (generic anti-enumeration response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid JSON or email (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing Origin (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password/reset:
    post:
      operationId: authPasswordReset
      summary: Reset password using a single-use reset token and revoke all sessions
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password updated and all active sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedMessageResponse"
        "400":
          description: Invalid token or password policy failure (`VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or missing Origin (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/setup:
    post:
      operationId: authMFASetup
      summary: Begin TOTP MFA enrollment (requires recent authentication)
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "200":
          description: TOTP provisioning secret and otpauth URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupResponse"
        "401":
          description: Unauthenticated, expired session, or re-authentication required (`UNAUTHENTICATED`, `SESSION_EXPIRED`, `REAUTH_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa/verify:
    post:
      operationId: authMFAVerify
      summary: Verify TOTP or recovery code (completes MFA setup or two-step login)
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: MFA verified and session rotated (includes one-time recoveryCodes on initial activation)
          headers:
            Set-Cookie:
              description: Rotated full HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAVerifyResponse"
        "400":
          description: Validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid MFA code or expired/locked pending session (`INVALID_MFA_CODE`, `SESSION_EXPIRED`, `UNAUTHENTICATED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reauth:
    post:
      operationId: authReauth
      summary: Re-authenticate an active session for high-risk operations
      security:
        - sessionCookie: []
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: Re-authenticated and session rotated with fresh last_auth_at
          headers:
            Set-Cookie:
              description: Rotated HttpOnly session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Validation error (`INVALID_JSON`, `VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials, invalid MFA code, or expired session (`INVALID_CREDENTIALS`, `INVALID_MFA_CODE`, `SESSION_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid Origin or CSRF token (`CSRF_INVALID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organizations:
    get:
      operationId: listOrganizations
      summary: List organizations the authenticated user belongs to
      security:
        - sessionCookie: []
      tags:
        - organizations
      responses:
        "200":
          description: Organizations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSummaryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createOrganization
      summary: Create a new organization
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}:
    get:
      operationId: getOrganization
      summary: Get organization details
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateOrganization
      summary: Update organization name
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteOrganization
      summary: Soft-delete an organization (requires recent auth and slug confirmation)
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSlugRequest"
      responses:
        "204":
          description: Organization marked as deleting
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}/transfer-ownership:
    post:
      operationId: transferOrganizationOwnership
      summary: Transfer organization ownership to another active member
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipRequest"
      responses:
        "204":
          description: Ownership transferred
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}/members:
    get:
      operationId: listOrganizationMembers
      summary: List active organization members
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
      responses:
        "200":
          description: Organization members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}/members/{memberId}:
    patch:
      operationId: updateOrganizationMember
      summary: Update a member's role
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/MemberIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "204":
          description: Member role updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: removeOrganizationMember
      summary: Remove a member from the organization
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/MemberIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}/invitations:
    get:
      operationId: listOrganizationInvitations
      summary: List pending organization invitations
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createOrganizationInvitation
      summary: Invite a user to the organization by email
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created and dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}/invitations/{invitationId}:
    delete:
      operationId: revokeOrganizationInvitation
      summary: Revoke a pending organization invitation
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/InvitationIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      responses:
        "204":
          description: Invitation revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      summary: Accept a pending organization invitation using its single-use token
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}/teams:
    get:
      operationId: listOrganizationTeams
      summary: List teams in the organization
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
      responses:
        "200":
          description: Teams list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createOrganizationTeam
      summary: Create a team in the organization
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
        - $ref: "#/components/parameters/OrgIDPath"
        - $ref: "#/components/parameters/CSRFTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"

  /organizations/{orgId}/teams/{teamId}:
    delete:
      operationId: deleteOrganizationTeam
      summary: Delete a team in the organization
      security:
        - sessionCookie: []
      tags:
        - organizations
      parameters:
