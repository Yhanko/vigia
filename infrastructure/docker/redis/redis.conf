# Configuração do Redis para o Vigia (fila Asynq, locks, dedup e rate limit).
# A autenticação (ACL) é gerada no arranque a partir do secret redis_password:
# ver o serviço "redis" em compose.yaml. A password nunca fica neste ficheiro.

port 6379
bind 0.0.0.0
protected-mode yes

# Durabilidade: a fila não pode perder jobs num reinício.
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
dir /data

# A fila não pode ser despejada: com "noeviction" o Redis recusa escritas quando
# enche, em vez de apagar jobs em silêncio. O alerta de memória trata o resto.
maxmemory 256mb
maxmemory-policy noeviction

# Ligações
timeout 300
tcp-keepalive 60
maxclients 1000

# Logs
loglevel notice
logfile ""

# Protecções adicionais
enable-debug-command no
enable-module-command no
enable-protected-configs no
